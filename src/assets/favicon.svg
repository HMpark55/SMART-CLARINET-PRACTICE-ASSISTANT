<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 클라리넷 아이콘: 왼쪽 위 마우스피스 → 오른쪽 아래 벨 (대각선) -->
  <g transform="rotate(45 32 32)">
    <!-- 마우스피스 -->
    <path d="M29.5 2 L34.5 2 L35.5 10 L28.5 10 Z" fill="#2b2238"/>
    <!-- 몸통 -->
    <rect x="28.5" y="10" width="7" height="40" rx="1.5" fill="#3b2f52"/>
    <!-- 은색 링 -->
    <rect x="27.5" y="10" width="9" height="2.4" rx="1" fill="#c9c3d6"/>
    <rect x="27.5" y="29" width="9" height="2.4" rx="1" fill="#c9c3d6"/>
    <!-- 구멍 -->
    <circle cx="32" cy="17" r="1.6" fill="#a78bfa"/>
    <circle cx="32" cy="23" r="1.6" fill="#a78bfa"/>
    <circle cx="32" cy="37" r="1.6" fill="#a78bfa"/>
    <circle cx="32" cy="43" r="1.6" fill="#a78bfa"/>
    <!-- 벨 -->
    <path d="M28.5 50 L35.5 50 L41 62 L23 62 Z" fill="#3b2f52"/>
    <rect x="22.5" y="60.5" width="19" height="2.5" rx="1" fill="#c9c3d6"/>
  </g>
</svg>
