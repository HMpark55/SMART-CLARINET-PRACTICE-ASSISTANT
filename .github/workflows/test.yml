# PR을 열거나 main에 올릴 때 시험을 자동으로 돌린다. 외부 라이브러리 없이 Node만 쓴다.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 운지표 시험
        run: node docs/test-fingerings.mjs
      - name: CSV 시험
        run: node docs/test-csv.mjs
      - name: 신호 형식 시험
        run: node docs/test-board.mjs
